name: FusionOS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # LINT & TYPECHECK
  # ══════════════════════════════════════════════════════════════════════════
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma Validate
        run: npx prisma validate --schema=packages/database/prisma/schema.prisma

      - name: Prisma Generate
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: API Typecheck
        run: cd apps/api && npx tsc --noEmit --project tsconfig.build.json

      - name: Web Typecheck
        run: cd apps/web && npx tsc --noEmit --project tsconfig.json

  # ══════════════════════════════════════════════════════════════════════════
  # BUILD
  # ══════════════════════════════════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma Generate
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Build shared packages
        run: npm run build -w packages/shared && npm run build -w packages/types && npm run build -w packages/config && npm run build -w packages/database

      - name: Build API
        run: npm run build -w apps/api

      - name: Build Web
        run: npm run build -w apps/web

  # ══════════════════════════════════════════════════════════════════════════
  # TESTS
  # ══════════════════════════════════════════════════════════════════════════
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fusionos
          POSTGRES_PASSWORD: fusionos
          POSTGRES_DB: fusionos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fusionos -d fusionos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://fusionos:fusionos@localhost:5432/fusionos_test?schema=public
      JWT_SECRET: test-secret-for-ci
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      AI_PROVIDER: ollama
      AI_BASE_URL: http://localhost:11434
      AI_MODEL: llama3.2
      AI_TIMEOUT: 10000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma Generate
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Apply migrations to test DB (migrate deploy — includes RLS)
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma

      - name: Verify RLS policies present (migrated, not db push)
        run: |
          npx prisma db execute --schema=packages/database/prisma/schema.prisma \
            --stdin <<'SQL'
          SELECT count(*) AS enabled_rls_tables
          FROM pg_class c
          WHERE c.relrowsecurity = true
            AND c.relkind = 'r'
            AND c.relnamespace = (SELECT oid FROM pg_namespace WHERE nspname = 'public');
          SQL

      - name: Seed test database
        run: npx tsx packages/database/prisma/seed.ts

      - name: Run API tests
        run: cd apps/api && npx vitest run --no-file-parallelism --reporter=verbose

      - name: RLS tests must EXECUTE (not skip)
        run: |
          cd apps/api
          output=$(npx vitest run --no-file-parallelism src/__tests__/security/rls-tenant-isolation.test.ts 2>&1)
          echo "$output"
          if echo "$output" | grep -qE 'Tests\s+22 passed'; then
            echo "RLS OK: 22/22 tests executed and passed."
          else
            echo "::error::RLS suite did not report 22 tests passed. RLS migration may not be applied in CI."
            exit 1
          fi

      - name: Run tests (determinism check #1)
        run: cd apps/api && npx vitest run --no-file-parallelism 2>&1 | grep -E "(Tests|Test Files)"

      - name: Run tests (determinism check #2)
        run: cd apps/api && npx vitest run --no-file-parallelism 2>&1 | grep -E "(Tests|Test Files)"

  # ══════════════════════════════════════════════════════════════════════════
  # DOCKER BUILD
  # ══════════════════════════════════════════════════════════════════════════
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f apps/api/Dockerfile -t fusionos-api:ci .

      - name: Build Web Docker image
        run: docker build -f apps/web/Dockerfile -t fusionos-web:ci .

      - name: Verify API image health
        run: |
          docker run -d --name fusionos-api-test -p 3001:3001 \
            -e DATABASE_URL=postgresql://unused:unused@localhost:5432/unused \
            -e JWT_SECRET=test \
            fusionos-api:ci
          sleep 5
          docker logs fusionos-api-test 2>&1
          docker stop fusionos-api-test
          docker rm fusionos-api-test

  # ══════════════════════════════════════════════════════════════════════════
  # SECURITY CHECKS
  # ══════════════════════════════════════════════════════════════════════════
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for secrets in code
        run: |
          echo "Checking for potential secrets..."
          if grep -rn "password\s*=\s*['\"]" --include="*.ts" --include="*.tsx" --include="*.js" apps/ packages/ 2>/dev/null; then
            echo "ERROR: Potential passwords found"
            exit 1
          fi
          if grep -rn "api[_-]key\s*=\s*['\"]" --include="*.ts" --include="*.tsx" --include="*.js" apps/ packages/ 2>/dev/null; then
            echo "ERROR: Potential API keys found"
            exit 1
          fi
          echo "No secrets detected"

      - name: Check for eval() usage
        run: |
          if grep -rn "eval(" --include="*.ts" --include="*.tsx" apps/ packages/ 2>/dev/null | grep -v "// " | grep -v "eval()"; then
            echo "ERROR: eval() usage found"
            exit 1
          fi
          echo "No eval() usage detected"

      - name: npm audit
        run: npm audit --audit-level=critical
